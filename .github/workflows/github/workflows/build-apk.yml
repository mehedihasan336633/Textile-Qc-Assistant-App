
name: Build Textile QC Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -o Textile_QC_Assistant_Android_Project.zip -d project

      - name: Find Android project
        run: |
          find project -name gradlew -type f
          find project -name settings.gradle.kts -type f

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew -type f | head -1)
          cd $(dirname $(find project -name gradlew -type f | head -1))
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Textile-QC-Assistant-APK
          path: project/**/build/outputs/apk/debug/*.apk
