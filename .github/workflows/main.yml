
name: Build Textile QC Assistant APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -o Textile_QC_Assistant_Android_Project.zip -d project

      - name: Enable AndroidX
        run: |
          mkdir -p project
          touch project/gradle.properties
          grep -qxF 'android.useAndroidX=true' project/gradle.properties || echo 'android.useAndroidX=true' >> project/gradle.properties

      - name: Fix Android Build Configuration
        run: |
          cat > project/app/build.gradle <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.textileqc.assistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.textileqc.assistant"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Textile-QC-Assistant-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
