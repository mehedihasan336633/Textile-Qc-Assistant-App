
name: Build Textile QC Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Textile_QC_Assistant_Android_Project.zip -d project

      - name: Extract App Icon Pack
        run: |
          ICON_ZIP=$(find . -maxdepth 1 -name "TextileQC_IconPack_Updated*.zip" | head -n 1)
          if [ -n "$ICON_ZIP" ]; then
            unzip -o "$ICON_ZIP" -d iconpack
            find iconpack -type d -name "mipmap-*" -exec cp -r {} project/app/src/main/res/ \;
          fi

      - name: Copy Web App
        run: |
          mkdir -p project/app/src/main/assets
          if [ -d project/www ]; then
            cp -r project/www/. project/app/src/main/assets/
          fi

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare Android project
        run: |
          cd project
          sed -i '/compileOptions {/,/}/ s/VERSION_1_8/VERSION_17/g' app/build.gradle.kts || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts || true

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Textile-QC-Assistant-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
