
name: Diagnose Android Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o Textile_QC_Assistant_Android_Project.zip -d project

      - name: Inspect Gradle files
        run: |
          echo "===== ROOT SETTINGS ====="
          cat project/settings.gradle.kts

          echo "===== ROOT BUILD ====="
          cat project/build.gradle.kts

          echo "===== ROOT APP BUILD ====="
          cat project/app/build.gradle.kts

          echo "===== ANDROID SETTINGS ====="
          cat project/android/settings.gradle.kts

          echo "===== ANDROID BUILD ====="
          cat project/android/build.gradle.kts

          echo "===== ANDROID APP BUILD ====="
          cat project/android/app/build.gradle.kts

      - name: Inspect Android source files
        run: |
          find project -type f \( -name "*.kt" -o -name "*.java" -o -name "AndroidManifest.xml" \) -print
